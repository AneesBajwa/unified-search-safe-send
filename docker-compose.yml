# `docker compose up` is the whole local setup. Phase 0 proves the path:
# Vite page -> API -> Postgres, with the migration applied on the way.

services:
  db:
    # 17 to match Neon (which serves 17.x), not the 16 the docs floor at.
    # design.md D5's isolation-level findings were verified on 17.9, and
    # testing the send gate on 16 while deploying onto 17 is exactly the kind
    # of parity gap that surfaces as an unreproducible concurrency bug.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # 5433 on the host, not 5432: a natively-installed Postgres commonly
      # already owns 5432, and Docker's bind on 0.0.0.0 loses to it for
      # `localhost` connections — which surfaces as `role "app" does not
      # exist` against someone else's database rather than as a port clash.
      # Inside the compose network everything still talks to db:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrations as their own one-shot service rather than an API entrypoint
  # hook: two API replicas starting together would otherwise race on the same
  # migration, and the failure mode is a half-applied schema.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    volumes:
      # Mounted for the same reason api and worker are: without it the baked
      # image's migration set is whatever existed at build time, and a new
      # revision fails with "Can't locate revision identified by '0002'" —
      # which reads like database corruption rather than a stale image.
      - ./packages:/app/packages
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: sh -c "exec uvicorn api.main:app --host 0.0.0.0 --port 8080 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      APP_BASE_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RUN_WORKER_INLINE: "${RUN_WORKER_INLINE:-1}"
      # Turn these on to watch partial results happen rather than infer them:
      #   SLOW_ADAPTER_SOURCE=slack SLOW_ADAPTER_DELAY_MS=8000 docker compose up -d api
      SLOW_ADAPTER_SOURCE: "${SLOW_ADAPTER_SOURCE:-}"
      SLOW_ADAPTER_DELAY_MS: "${SLOW_ADAPTER_DELAY_MS:-0}"
      # The fake provider's ledger, on a bind mount shared with the worker.
      # It is what "how many messages did the provider actually receive?" is
      # answered from — a question no database row can answer — and being on
      # disk is what lets it survive a worker being killed mid-dispatch.
      FAKE_PROVIDER_LEDGER: /var/fake-provider/deliveries.jsonl
    ports:
      - "8080:8080"
    volumes:
      - ./packages:/app/packages
      - ./apps/api:/app/apps/api
      - ./.fake-provider:/var/fake-provider
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: sh -c "exec uvicorn worker.main:app --host 0.0.0.0 --port 8081"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      RUN_WORKER_INLINE: "0"
      FAKE_PROVIDER_LEDGER: /var/fake-provider/deliveries.jsonl
      # Set to a few thousand to watch a send sit in flight — and to make
      # "kill the worker mid-dispatch" a thing a person can actually do.
      FAKE_PROVIDER_DELAY_MS: "${FAKE_PROVIDER_DELAY_MS:-0}"
    ports:
      - "8081:8081"
    volumes:
      - ./packages:/app/packages
      - ./apps/worker:/app/apps/worker
      - ./.fake-provider:/var/fake-provider
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - webnodemodules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  webnodemodules:
