[alembic]
script_location = packages/core/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is deliberately NOT set here. env.py reads it from
# core.config, which reads DATABASE_URL from the environment. In every
# environment except local the URL carries a password, and alembic.ini is
# checked in.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
